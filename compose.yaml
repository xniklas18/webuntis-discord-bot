services:
  webuntis-discord-bot:
    build: .
    container_name: webuntis-discord-bot
    environment:
      WEB_PORT: "4000"
    env_file:
      - /home/admin/container/WebuntisBot/test.env
    ports:
      - "4000:4000"
    volumes:
      # Verschlüsselte Nutzerkonten (users.json), gemeinsam mit der Website genutzt
      - bot-data:/app/data
    restart: unless-stopped

volumes:
  bot-data:
    external: true
    name: webuntisbot-test_bot-data
